# Arc Lock — iPhone app + four Screen Time extensions. Generate the Xcode project with `xcodegen generate`
# (the .xcodeproj is not committed). Every target needs the Family Controls entitlement and the shared App Group.
name: ArcLock
options:
  bundleIdPrefix: io.github.weldingarc
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "11"
    DEVELOPMENT_TEAM: 446W55N7PB
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    OTHER_SWIFT_FLAGS: "-file-prefix-map $(SRCROOT)/=./"
targets:
  ArcLock:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "ArcLock.entitlements", "PrivacyInfo.xcprivacy", "Fonts/**", "Resources/**"]
      - path: Shared
      - path: Core
      - path: Extensions/Report/UsageView.swift
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: App/Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - target: ArcLockMonitor
      - target: ArcLockShieldConfig
      - target: ArcLockShieldAction
      - target: ArcLockReport
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: ArcLock
        PRODUCT_BUNDLE_IDENTIFIER: io.github.weldingarc.arclock
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/ArcLock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the other themes' icons (Settings › Appearance › App icon)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Graphite AppIcon-Forest AppIcon-Plum AppIcon-Paper"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ArcLockMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Monitor
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: Core
      - path: Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ArcLockMonitor
        PRODUCT_BUNDLE_IDENTIFIER: io.github.weldingarc.arclock.monitor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Extensions/Monitor/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/Monitor/Monitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  ArcLockShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfig
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: Core
      - path: Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ArcLockShieldConfig
        PRODUCT_BUNDLE_IDENTIFIER: io.github.weldingarc.arclock.shield-config
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Extensions/ShieldConfig/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldConfig/ShieldConfig.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  ArcLockShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: Core
      - path: Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ArcLockShieldAction
        PRODUCT_BUNDLE_IDENTIFIER: io.github.weldingarc.arclock.shield-action
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Extensions/ShieldAction/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/ShieldAction/ShieldAction.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  ArcLockReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Extensions/Report
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: Core
      - path: Extensions/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ArcLockReport
        PRODUCT_BUNDLE_IDENTIFIER: io.github.weldingarc.arclock.report
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Extensions/Report/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/Report/Report.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
